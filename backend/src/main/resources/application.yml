server:
  port: 8080

utwin:
  access-key: ${UTWIN_ACCESS_KEY:}
  secret-key: ${UTWIN_SECRET_KEY:}
  endpoint: ${UTWIN_ENDPOINT:https://dev.bwton.cn/cps-dev01}
  ws:
    enabled: ${UTWIN_WS_ENABLED:true}
    max-reconnect-attempts: ${UTWIN_WS_MAX_RECONNECT_ATTEMPTS:3}
    reconnect-interval: ${UTWIN_WS_RECONNECT_INTERVAL:5s}
    heartbeat-interval: ${UTWIN_WS_HEARTBEAT_INTERVAL:30s}
    connect-timeout: ${UTWIN_WS_CONNECT_TIMEOUT:10s}
    task-cache-max-size: ${UTWIN_WS_TASK_CACHE_MAX_SIZE:1000}
    task-cache-ttl: ${UTWIN_WS_TASK_CACHE_TTL:1h}
