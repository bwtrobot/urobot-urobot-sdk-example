server:
  port: 8080

urobot:
  access-key: ${UROBOT_ACCESS_KEY:}
  secret-key: ${UROBOT_SECRET_KEY:}
  endpoint: ${UROBOT_ENDPOINT:https://dev.bwton.cn/cps-dev01}
  ws:
    enabled: ${UROBOT_WS_ENABLED:true}
    max-reconnect-attempts: ${UROBOT_WS_MAX_RECONNECT_ATTEMPTS:3}
    reconnect-interval: ${UROBOT_WS_RECONNECT_INTERVAL:5s}
    heartbeat-interval: ${UROBOT_WS_HEARTBEAT_INTERVAL:30s}
    connect-timeout: ${UROBOT_WS_CONNECT_TIMEOUT:10s}
    task-cache-max-size: ${UROBOT_WS_TASK_CACHE_MAX_SIZE:1000}
    task-cache-ttl: ${UROBOT_WS_TASK_CACHE_TTL:1h}
logging:
  level:
    root: INFO
    io.github.bwtrobot: DEBUG